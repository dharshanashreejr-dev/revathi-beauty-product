<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order details</title>
<style>
  :root{--bg:#f3f5ec;--card:#fff;--ink:#1f2a1c;--muted:#6b7566;--line:#e3e8d6;--g:#3f5a34;--g2:#e8eed8;--red:#b42318}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
  .brand{text-align:center;padding:14px 0 6px}
  .brand b{display:block;letter-spacing:.14em;font-size:13px;color:var(--g)}
  .brand span{font-size:12px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .oid{font-size:20px;font-weight:700}
  .muted{color:var(--muted);font-size:13px}
  .badge{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--g2);color:var(--g);font-weight:600;font-size:13px;white-space:nowrap}
  .badge.x{background:#fde8e6;color:var(--red)}
  .steps{display:flex;margin-top:16px}
  .step{flex:1;text-align:center;font-size:10.5px;color:var(--muted);position:relative}
  .step i{display:block;width:16px;height:16px;border-radius:50%;background:var(--line);margin:0 auto 5px;position:relative;z-index:1}
  .step:not(:last-child)::after{content:"";position:absolute;top:7px;left:50%;width:100%;height:2px;background:var(--line)}
  .step.on i,.step.on:not(:last-child).done::after{background:var(--g)}
  .step.on{color:var(--ink);font-weight:600}
  .step.done::after{background:var(--g)}
  h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--muted)} .row .v{text-align:right;font-weight:500}
  .item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .item small{color:var(--muted);display:block}
  .tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding-top:12px}
  a{color:var(--g)}
  .err{text-align:center;padding:40px 10px;color:var(--red)}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>REVATHI HERBAL BEAUTY CARE</b><span>Order details</span></div>
  <div id="app"></div>
  <p class="foot">Status shown is as of the time this QR was printed.</p>
</div>
<script>
(function(){
  var app=document.getElementById('app');
  var STAGES=['Placed','Confirmed','Packed','Shipped','Delivered'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function inr(n){return '\u20B9'+Number(n||0).toLocaleString('en-IN')}
  function fmt(d){var x=new Date(d);return isNaN(x)?esc(d):x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
  function row(k,v){return v?'<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>':''}
  try{
    var m=location.hash.match(/d=([A-Za-z0-9_-]+)/);
    if(!m) throw 0;
    var b=m[1].replace(/-/g,'+').replace(/_/g,'/');
    var d=JSON.parse(decodeURIComponent(escape(atob(b))));
    var cancelled=d.s===-1, st=cancelled?-1:d.s;
    var steps=cancelled?'':'<div class="steps">'+STAGES.map(function(n,i){return '<div class="step'+(i<=st?' on':'')+(i<st?' done':'')+'"><i></i>'+n+'</div>'}).join('')+'</div>';
    var items=(d.l||[]).map(function(x){return '<div class="item"><div>'+esc(x[0])+'<small>Qty '+esc(x[1])+' \u00D7 '+inr(x[2])+'</small></div><strong>'+inr(x[1]*x[2])+'</strong></div>'}).join('');
    var qty=(d.l||[]).reduce(function(s,x){return s+x[1]},0);
    app.innerHTML=
      '<div class="card"><div class="top"><div><div class="oid">'+esc(d.i)+'</div><div class="muted">Placed on '+fmt(d.d)+'</div></div>'
      +'<span class="badge'+(cancelled?' x':'')+'">'+(cancelled?'Cancelled':STAGES[st]||'')+'</span></div>'+steps+'</div>'
      +'<div class="card"><h3>Customer & delivery</h3>'
      +row('Name',esc(d.c))+row('Phone',d.p?'<a href="tel:'+esc(d.p)+'">'+esc(d.p)+'</a>':'')+row('Address',esc(d.a))
      +row('Courier',esc(d.k))+row('Tracking no.',esc(d.w))+'</div>'
      +'<div class="card"><h3>Items ('+qty+')</h3>'+items+'<div class="tot"><span>Total</span><span>'+inr(d.t)+'</span></div>'
      +'<div class="row" style="margin-top:8px"><span class="k">Payment</span><span class="v">'+esc(d.y||'-')+'</span></div></div>';
    document.title='Order '+d.i;
  }catch(e){
    app.innerHTML='<div class="card err">This QR code is not valid or the link was cut short.<br>Please scan the QR again.</div>';
  }
})();
</script>
</body>
</html>
